### Эвенты

victory_in_north_africa.1.a:0 "Успех в Северной Африке!"
victory_in_north_africa.1.b:0 "Союзные войска под командованием Бернарда Монтгомери вытеснили силы Оси из Северной Африки. Теперь объединённую армию союзников на Африканском континенте не что не сдерживает для дальнейшей атаки в самое подбрюшье Европы. \n\n Цивилизованный западный мир с воодушевлением следит за успехами своих героев, в то время как политики стран ОСИ пытаются сгладить углы и приуменьшить значимость африканского фронта на дальнейших ход боевых действий."
victory_in_north_africa.1.c:0 "Мы должны победить в Европе, чтобы компенсировать эти потери."
victory_in_north_africa.1.d:0 "Победа в наших руках."

preparing_for_the_surrender_of_Great_Britain.1.b:0 "Тяжелые времена в Европпе"
preparing_for_the_surrender_of_Great_Britain.1.c:0 "В ходе недавних затяжных боев в северной Африке, армия стран ОСИ под командованием Эрвина Роммеля нанесла нам тяжелое поражение, сокрушив наши лучшие дивизии и в конечном итоге взяв под свой полный контроль Суэцкий канал. \n\n Поражение в битве, не равно поражение в войне! Мы должны мобилизовать все имеющиеся у нас силы для подготовки к ответным мерам. Наши люди в тылу готовы выложиться на все 200% лишь бы обеспечить здесь и сейчас фронт столь необходимыми боеприпасами и снаряжением. Так пусть и наша славная армия ответит взаимностью на их трудовые подвиги!"
preparing_for_the_surrender_of_Great_Britain.1.d:0 "Будем готовится к худшему"
