### Фокусы Франции
FRA_Colonial_steel_industry:0 "Колониальная сталилетейная промышленность"
FRA_Colonial_steel_industry_desc:0 "После потери нашей родны, мы лишились доступа к нашим месторождениям стали, а без нее мы не сможем полноценно продолжать войну. Еще задолго до войны в северной Африки нами были обнаружены богатые месторождения железной руды. Если раньше эти месторождения не были столь интересны для нас, то сейчас они имеют стратегическое значение!"

FRA_African_Industrial_Centre:0 "Африканский промышленный центр"
FRA_African_Industrial_Centre_desc:0 "Наша страна сейчас переживает тяжелые времена, однако наши предприниматели уже давно успели перенести свой бизнес в центральной Африке. Если мы поддержим эти предприятия, то сможем в бедующем на их основе построить современные промышленный центр что поможет нам освободить нашу родину из рук оккупантов." 
