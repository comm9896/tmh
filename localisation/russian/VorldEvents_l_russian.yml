### Эвенты
 
### Победа союзников в северной африке
Allied_victory_in_Africa.1.a:0 "Победа союзников в Северной Африке!"
Allied_victory_in_Africa.1.b:0 "Союзные войска под командованием Бернарда Монтгомери вытеснили силы Оси из Северной Африки. Теперь объединённую армию союзников на Африканском континенте не что не сдерживает для дальнейшей атаки в самое подбрюшье Европы. \n\n Цивилизованный западный мир с воодушевлением следит за успехами своих героев, в то время как политики стран ОСИ пытаются сгладить углы и приуменьшить значимость африканского фронта на дальнейших ход боевых действий."
Allied_victory_in_Africa.1.c:0 "Мы должны победить в Европе, чтобы компенсировать эти потери."
Allied_victory_in_Africa.1.d:0 "Победа в наших руках."
Allied_victory_in_Africa.1.e:0 "Все же армия союзников может бить фашистов"
Allied_victory_in_Africa.1.f:0 "Все же армия союзников что-то да может"

Allied_victory_in_Africa_with_VIC.1.a:0 "Союзники интегрируют Вишитскую Африку"
Allied_victory_in_Africa_with_VIC.1.b:0 "В ходе тайных переговоров между правительством Африканских колоний Франции и Союзных сил было подписано соглашение об интеграции Вишитской Африки во Франко-Британский Союз. Организованные местным правительством отряды полиции так же перешли под командование союзных войск."
Allied_victory_in_Africa_with_VIC.1.c:0 "Прекрасные новости"
Allied_victory_in_Africa_with_VIC.1.d:0 "Это предательство!"
Allied_victory_in_Africa_with_VIC.1.e:0 "Интерестно"
Allied_victory_in_Africa_with_VIC.1.f:0 "Мировая сцена меняется."

### Окружение под дюнкерком

Sapr_dunkerk_evacuation_news.1.a:0 "Окружение под Дюнкерком!"
Sapr_dunkerk_evacuation_news.1.b:0 "В ходе стремительного Немецкого наступления в Бельгии объединенная Англо-Франко-Бельгийская армия оказалась окружена и прижата к Ла-Маншу под Дюнкерком. Командование окруженным гарнизоном взял на себя Бельгийский генерал М.К.Л. Кейертс. \n\n Хоть в Дюнкерке и нет портовой инфраструктуры, однако бойцы верят что они смогут вовремя построить временные причалы, из того мусора что скопился на пляже, и уплыть с этого проклятого места."
Sapr_dunkerk_evacuation_news.1.c:0 "Скоро мы раздавим их!"
Sapr_dunkerk_evacuation_news.1.d:0 "Мы не бросим своих в западне!"
Sapr_dunkerk_evacuation_news.1.e:0 "Похоже у Союзников серьезные проблемы"

### Крепость Демянск

Sapr_Fortress_Demyansk_news.1.a:0 "Крепость Демянск!"
Sapr_Fortress_Demyansk_news.1.b:0 "В ходе стремительного блицкрига Немецких войск на севере, под их натиском пала Псковская и Новгородская область, Ленинград находится на осадном положении. Для укрепления линии фронта, Гитлер лично провозгласил некому неизвестную Новгородскую деревню Демянск, деревней Крепостью, что станет ключом в удержании всей линии фронта Группы армии Север для дальнейшего наступления на Тихвин. \n\n Гарнизону Демянска приказано сражаться до последнего патрона и не боятся окружения. Оборону Демянска лично возглавляет и координирует граф Вальтер фон Брокдорф-Алефельд, что уже успел провозгласить Демянск территорией своего графства за которую он будет сражаться до последней капли крови!"
Sapr_Fortress_Demyansk_news.1.c:0 "Графство Демянск будет держаться вечно!"
Sapr_Fortress_Demyansk_news.1.d:0 "Сдался Немцам эта деревня?"
Sapr_Fortress_Demyansk_news.1.e:0 "Скоро мы отобьем эту деревню!"


### Варшавское востание

Sapr_sov_Warsawskoe_vostanie_news.1.a:0 "Варшавское восстание!"
Sapr_sov_Warsawskoe_vostanie_news.1.b:0 "Сегодня утром Польские подпольщики устроили масштабное вооруженное просоветское восстание в Варшаве во главе с Владисловам Гомулкой. В считаные часы им удалось захватить Немецкие склады с оружием и казармы Рейха. По всему городу и округе идут активные бои. Бунтовщики твердо уверены, что своими действиями они поспособствуют скорейшему освобождению Польши из лап Фашистов!"
Sapr_sov_Warsawskoe_vostanie_news.1.c:0 "Этот метеж будет раздавлен!"
Sapr_sov_Warsawskoe_vostanie_news.1.d:0 "Надеюсь, они знают что делают."
Sapr_sov_Warsawskoe_vostanie_news.1.e:0 "Рабочие Польши - свобода идет!"

### Варшавское востание

Sapr_Warsawskoe_vostanie_is_dead_news.1.a:0 "Варшавское восстание подавлено!"
Sapr_Warsawskoe_vostanie_is_dead_news.1.b:0 "Сегодня вечером Немецкое командование официально сообщило о полном подавлении Польского мятежа в Варшаве. Им удалось не допустить прорыва авангарда Советских войск, а без помощи из вне мятеж был обречен на провал. \n\n Ваффен-СС и регулярные воска Рейха дочищают оставшиеся кварталы города от бунтовщиков. В городе постоянно слышатся звуки выстрелов расстрельных команд и крики оставшихся в живых мирных жителей. Весь город превратился в одну сплошную кровавую баню."
Sapr_Warsawskoe_vostanie_is_dead_news.1.c:0 "Путь это будет уроком для остальных!"
Sapr_Warsawskoe_vostanie_is_dead_news.1.d:0 "Они знали на что идут"
Sapr_Warsawskoe_vostanie_is_dead_news.1.e:0 "Их смерть не была напрасна"

### Победа в Северной африке

victory_in_north_africa.1.a:0 "Победа в Северной Африке!"
victory_in_north_africa.1.b:0 "Победа в Северной Африке!"
victory_in_north_africa.1.c:0 "В ходе ожесточенных боев объединенной армии Союзных войск удалось полностью освободить территорию северной Африки Итало-Германской коалиции. Это прекрасная победа нашей армии её величество на долго останется в памяти нашей нации. \n\n Теперь, когда силы ОСИ лишились своего влияния в северной Африке, полицейский гарнизон Вишистской Франции остался практически беззащитными. Наши дипломаты и тайные агенты уже отправились в Алжир и Тунис для проведения секретных переговоров с местными правителями."
victory_in_north_africa.1.d:0 "Скоро мы освободим Итальянский народ от оков фашизма"
victory_in_north_africa.1.f:0 "В ходе ожесточенных боев объединенной армии Союзных войск удалось полностью освободить территорию северной Африки Итало-Германской коалиции. Это прекрасная победа нашей армии её величество на долго останется в памяти нашей нации. \n\n Теперь в Африке нашей армии не что не угрожает и мы можем готовится к проведению новых десантных операций в акватории средиземного моря."

victory_in_north_africa1_tt:0 "Государство §YВеликобританию§! аннексирует территорию §YВишитской Африки§!"

victory_in_north_africa1.1.b:0 "Успех в переговорах с правительством Вишитской Африки"
victory_in_north_africa1.1.c:0 "В ходе тайных переговоров между правительством Африканских колоний Франции и нашими тайными агентами нам удалось склонить их на свою сторону. Мы гарантируем их независимость и сохранность их владений в обмен на их вступление в альянс."
victory_in_north_africa1.1.d:0 "Прекрасные новости!"

### Падение Кенегсберга


### Операция Факел

Allied_Operation_Torch_news.1.a:0 "Высадка Союзников в Алжире!"
Allied_Operation_Torch_news.1.b:0 "Сегодня рано утром объединённая Армия союзников осуществила успешное вторжение на территорию Касабланки. Им на помощь пришли силы местной полиции. Открытие второго фронта в северной Африке так же ставит под угрозу всю Ливийскую нефтедобычу, и систему снабжения армии в Северной Африке."
Allied_Operation_Torch_news.1.c:0 "Следующая остановка Триполи"
Allied_Operation_Torch_news.1.d:0 "Они поплатяться за это!"
Allied_Operation_Torch_news.1.e:0 "Будем надемся, что у Саюзников все получится."


Sapr_fall_of_Kenegsberg.1.a:0 "Падение Кёнигсберга"
Sapr_fall_of_Kenegsberg.1.b:0 "В ходе долгих и кропотливых штурмовых операций, советским войска удалось взять под свой контроль город-крепость Кёнигсберг! Опираясь на долговременные укрепления и фортификации армия Рейха пыталась сдержать продвижение противника, однако форт за фортом советские войска потихоньку продвигались вглубь города пока не сокрушили главную цитадель города. После потери главного форта гарнизон был вынужден сложить оружие и сдаться на милость победителям. "
Sapr_fall_of_Kenegsberg.1.c:0 "Похоже у Рейха не все хорошо"
Sapr_fall_of_Kenegsberg.1.d:0 "Предатели Нации должны быть уничтожены!"
Sapr_fall_of_Kenegsberg.1.e:0 "Это была сложная победа!"

### Вахта на Рейне


Sapr_vahta_na_Reine_news.1.a:0 "Вахта на Рейне!"
Sapr_vahta_na_Reine_news.1.b:0 "Сегодня на рассвете, после предварительной арт подготовки, Немецкие войска начали крупномасштабное наступление в районе Орденских Лесов. Победоносная армия союзников в панике бежит под натиском немецких войск. В скором времени все Англо-Американские войска будут отброшены обратно в Ла-Манш!"
Sapr_vahta_na_Reine_news.1.c:0 "Мы отбросим их обратно в Ла-Манш!"
Sapr_vahta_na_Reine_news.1.d:0 "Мы обязательно выстоим!"
Sapr_vahta_na_Reine_news.1.e:0 "Похоже у союзников проблемы"

Sapr_Rommel_the_Desert_Fox.1.a:0 "Появление Лиса пустыни в Северной Африке"
Sapr_Rommel_the_Desert_Fox.1.b:0 "Наблюдая за печальным положением Североафриканского фронта, Гитлер отправил на помощь Итальянской армии отдельный танковый корпус “Африка” под командованием прославленным полководцем Эрвином Роммелем. Своим появлением он радикально поменял баланс сил в Северной Африке. \n\n Пользуясь абсолютным преимуществом в мобильности, он постоянно появлялся словно из неоткуда и наносил сокрушительные удары по тылам армии союзников, а затем вновь бесследно исчезал в пыли африканской бури. Своими кинжальными контр атаками он заслужил зловещую репутацию в стане армии союзников и прозвище Лис пустыни."
Sapr_Rommel_the_Desert_Fox.1.c:0 "Скоро Каир подет перед его ногами!"
Sapr_Rommel_the_Desert_Fox.1.d:0 "Каир мы не сдадим!"
Sapr_Rommel_the_Desert_Fox.1.e:0 "Похоже у союзников проблемы"

Sapr_winter_41_news.1.a:0 "Суровая зима 41 года"
Sapr_winter_41_news.1.b:0 "Ко всеобщему удивлению зима на восточном фронте в 41 году выдалась особенно суровой. Красная Армия и Вермахт оказались полностью не готовы к таким суровым условиям и вынуждены адаптироваться под суровые реалии на фронте."
Sapr_winter_41_news.1.c:0 "Мы обязательно переживем эту зиму."


#Совок
preparing_for_the_surrender_of_Great_Britain1.1.b:0 "Тяжелые времена в Европпе"
preparing_for_the_surrender_of_Great_Britain1.1.c:0 "Как мы и предполагали Германия все же решилась на осуществление плана по морскому вторжению в Великобританию. Перед их ногами уже успел пасть Париж, а теперь еще и Лондон. Похоже, что в скором времени встанет вопрос о подписании акта о капитуляции теперь и Великобританией. Когда мы подписывали с Германией пакт о ненападении мы и подумать не могли, что немецкая военная машина сможет так быстро захватить Францию, а теперь настала очередь и Англичан. Больше в Европе Германию не что не сковывает, а это значит, что единственной целью для дальнейшей экспансии для них остались только мы. Нам нужно немедленно мобилизовать все силы на скорейшую подготовку к активным боевым действиям в Европе. Нужно как можно быстрее объяснить всем гражданам Советского союза, что мирное время закончилось, и нужно как можно быстрее готовится к войне! Если мы сейчас не мобилизуем себя и все наши ресурсы, то нас поработят!"
preparing_for_the_surrender_of_Great_Britain1.1.d:0 "Нужно немедленно провести по всей стране всеобщую мобилизацию!"

### Идеи
hard_time:0 "Тяжелые времена"
SOV_hard_time:0 "Тяжелые времена"

#ЮСА
preparing_for_the_surrender_of_Great_Britain2.1.b:0 "Тяжелые времена в Европпе"
preparing_for_the_surrender_of_Great_Britain2.1.c:0 "Похоже Гитлер все же решился на осуществление морского вторжения на Великобританию. Падение Лондона лишь начало, похоже в скором времени судьба Великобритании будет предрешена. Потеря туманного Альбиона это лишает нас не только мощного союзника в Европе, но еще и не потопляемый аэродром и удобный плацдарм для вторжения. Больше мы не в силах повлиять на баланс сил в Европе, как бы не печально было это осозновать, однако единственной силой в Европе, способной бросить вызов Германии – это СССР. Если падет СССР, то уже не что не остановить 3 Рейх от мирового господства. Мы должны забыть о нашей политике изоляционизма и провести по всей стране скорейшую, всеобщую мобилизацию!"
preparing_for_the_surrender_of_Great_Britain2.1.d:0 "Даже потеряв Великобританию мы не сдадимся!"


#Доминионы

Sapr_Allies_lost_Africa.1.b:0 "Мы не сдадимся!"
Sapr_Allies_lost_Africa.1.c:0 "В ходе недавних затяжных боев в северной Африке, армия стран ОСИ под командованием Эрвина Роммеля нанесла нам тяжелое поражение, сокрушив наши лучшие дивизии и в конечном итоге взяв под свой полный контроль Суэцкий канал. \n\n Поражение в битве, не равно поражение в войне! Мы должны мобилизовать все имеющиеся у нас силы для подготовки к ответным мерам. Наши люди в тылу готовы выложиться на все 200% лишь бы обеспечить здесь и сейчас фронт столь необходимыми боеприпасами и снаряжением. Так пусть и наша славная армия ответит взаимностью на их трудовые подвиги!"
Sapr_Allies_lost_Africa.1.d:0 "За Британскую корону! "

Sapr_Axis_lost_in_Africa.1.b:0 "Подготовка к худшему"
Sapr_Axis_lost_in_Africa.1.c:0 "Похоже объединенная армия союзников сильнее чем мы думали. Им все же удалось полностью вытеснить страны ОСИ из северной Африки. Разрабатываемый нашим генеральным штабом план по удару по южной зоне ресурсов предполагал быстрый захват колоний западноевропейских стран практически без сопротивления со стороны противника. Однако в свете новых событий, нам стоит слегка пересмотреть планы и получше подготовиться к грядущей операции и быть готовыми к худшему из возможных вариантов развития событий."
Sapr_Axis_lost_in_Africa.1.d:0 "За Императора! За Хирохито!"
Sapr_Axis_lost_in_Africa.1.e:0 "За императора! За Айсиньгёро Пуи!"
Sapr_Axis_lost_in_Africa.1.f:0 "За императора! За великий Таиланд!"


preparing_for_the_surrender_of_Great_Britain3.1.b:0 "Тяжелые времена в Европпе"
preparing_for_the_surrender_of_Great_Britain3.1.c:0 "Похоже Гитлер все же решился на осуществление морского вторжения на Великобританию. Падение Лондона лишь начало, похоже в скором времени судьба Великобритании будет предрешена. Великобритания, для многих нас была родным домом, однако теперь она в руках Германии. Мы потеряли не только сильного союзника, но еще и нашего лидера. Однако мы не можем посрамить нашу старую родину и должны сделать все возможное, что в наших силах, дабы не посрамить честь Британской короны! "
preparing_for_the_surrender_of_Great_Britain3.1.d:0 "Даже потеряв нашего лидера мы не сдадимся!"

preparing_for_the_surrender_of_Great_Britain6.1.b:0 "Тяжелые времена в Европпе"
preparing_for_the_surrender_of_Great_Britain6.1.c:0 "Похоже Гитлер все же решился на осуществление морского вторжения на Великобританию. Падение Лондона лишь начало, похоже в скором времени судьба Великобритании будет предрешена. Великобритания, для многих нас была родным домом, однако теперь она в руках Германии. Мы потеряли не только сильного союзника, но еще и нашего лидера. Однако мы не можем посрамить нашу старую родину и должны сделать все возможное, что в наших силах, дабы не посрамить честь Британской короны! "
