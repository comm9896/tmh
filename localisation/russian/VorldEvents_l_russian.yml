preparing_for_the_surrender_of_Great_Britain4.1.b:0 "Мы не сдадимся!"
preparing_for_the_surrender_of_Great_Britain4.1.c:0 "К сожалению, как не прискорбно это звучало, Германии все же удалось осуществить успешную морскую операцию по вторжению на нашу родину. Их армия, что недавно уже успела сокрушить Францию теперь всей своей мощью обрушилась и на нас. Наша сухопутная армия не в силах сдержать натиск врага и похоже, что в скором времени мы полностью потеряем родной дом… Однако мы не сдадимся! У нас еще есть союзники, в том числе наши доминионы, что во многом рассчитывают на нас."
preparing_for_the_surrender_of_Great_Britain4.1.d:0 "Мы некогда не сдадимся!"

