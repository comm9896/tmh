 ### Фокусы Австралии
 
 AST_Australian_Circular_Railway:0 "Железная дорога на севере"
 AST_Australian_Circular_Railway_desc:0 "Большая часть нашей страны по сей день остается отрезанной от основной железнодорожной сети нашего континента. Мы уже давно грезим об идеи окутать нашу страну кольцевой железнодорожной магистралью."

 
 
 AST_Northern_infrastructure_development:0 "Развитие инфраструктуры на севере"
 AST_Northern_infrastructure_development_desc:0 "Дальнейший план развития северных регионов подразумевает интенсивное финансирование инфраструктурных проектов. Благодаря развитой железнодорожной сети у нас нет возникнет проблем с подвозом стройматериалов."

 AST_Western_infrastructure_development:0 "Развитие западной инфраструктуры"
 AST_Western_infrastructure_development_desc:0 "Наши западные земли заметно отстают от восточных земель. Для привлечения инвестиционной привлекательности в регион нам нужно вложится в строительство инфраструктурных проектов."

 AST_Unrestricted_warfare_at_sea:0 "Массовое производство подводных лодок"
 AST_Unrestricted_warfare_at_sea_desc:0 "Сделав ставку на массовое производство подводных лодок мы можем быть уверены, что у врага точно будут серьезные проблемы со снабжением по морю."
 
 AST_modern_fleet:0 "Современные ВМС Австралии"
 AST_modern_fleet_desc:0 "Мы на можем позволить себе не каких уступок в битве на море. Нам нужно идти в ногу со временем и не забывать о своевременной модернизации наших ВМС."
 
 AST_modern_docks:0 "Модернизация Австралийских доков"
 AST_modern_docks_desc:0 "Для дальнейшего обеспечения безопасности на наших морских коммуникациях, мы должны модернизировать нашу судостроительную промышленность и сконцентрироваться на кооперации наших корабелов для долгосрочного стабильного развития нашего отечественного кораблестроения."
 
 AST_create_a_Pacific_military_intelligence_center:0 "Тихоокеанский разведывательный центр"
 AST_create_a_Pacific_military_intelligence_center_desc:0 "Мы не можем игнорировать исходящую со стороны Японской Империи угрозу для нашей родины. Пока Британские развед службы полностью сконцентрированы на европейском театре военных действий, нам нужно сформировать свой собственный центр военной разведки что возьмет под свой контроль весть тихоокеанский регион."
 
 AST_CSIR_tt:0 "Улучшит промышленный концерн §Y BHP Steel§!"
 AST_fund_australian_defense_research_tt:0 "Улучшит промышленный концерн §Y Дженерал Электрик§!"
 AST_Queensland_Rail:0 "Железная дорога Квинсленда"
 
 AST_escort_fleet:0 "Авианесущий металолом"
 AST_modern_docks_desc:0 "Для надежной защиты наших морских путей нашим мусорным эсминцам нужна поддержка с воздуха. Нашей флотилии из металлолома нужен свой авианосец."

 AST_infrastructure_Papua_Neuguinea:0 "Развитие Папуа-Новой Гвинеи"
 AST_infrastructure_Papua_Neuguinea_desc:0 "Папуа-Новая Гвинея являются не только воротами, прикрывающими наши северные морские границы, но еще и важным источником полезны ископаемых. Прежде чем приступить к укреплению наших северных рубежей, нам нужно построить современную инфраструктуру."

