 le_defr.t:0 "Потеря крупного города/стратегического города. Ещё одна потеря советского народа, сколько это может продолжаться?"
 le_defa.d:0 "Падение Ленинграда"
 le_defa.t:0 "Это крупное поражение, может быть уже нет смысла продолжать кровопролитие? Некогда бывшая столица РИ теперь находится в разрухе, а на клицах полно тел, людей умерших от голода или от снарядов. Это удар по престижу СССР! Ещё одна потеря советского народа, сколько это может продолжаться?"
 le_def.d:0 "Падение МОСКВЫ"
 le_def.t:0 "Сердце нашей страны было охвачены пламя, а по улицам несутся железные машины. С востока Япония готова вступить в войну. Что же будет дальше?. Это удар по престижу СССР! Ещё одна потеря советского народа, сколько это может продолжаться? Вероятно нам стоит сдаться..."
 le_defe.d:0 "Падение Сталинграда"
 le_defe.t:0 "Это крупное поражение, может быть уже нет смысла продолжать кровопролитие? Немцам открыт путь до кавказа со всеми запасами нефти. Видимо мы всё же проиграем. Ещё одна потеря советского народа, сколько это может продолжаться?"
 le_defen.d:0 "Падение Риги"
 le_defen.t:0 "Здесь находился крупный авиационный завод, что же будет с нашими ВВС? Ещё одна потеря советского народа, сколько это может продолжаться?"
