 startup.institut.3.description:0 "У тебя есть выбор, стоять в мейне, что крайне сложно, но если пойти по военной ветке, то можно получить бонус к атаке и защите, а также две скидки на доку. Также всегда можно просто уехать в Африку) А и не забывай что после капитуляции у тебя появится возможность вписать себе генов по фокусу."
