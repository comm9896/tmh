 SAF_prodaza_chrome:0 "Продать "Натальские" месторождения хрома"
 pojar_plaki_plaki.t:0 "Лето 1936 года было сухое, ветреное и очень жаркое. В центральной России температура достигала 37–38 градусов, было зафиксировано семь температурных рекордов. При этом три месяца не было дождей. В Рязанской области начались лесные пожары, но никто не мог оценить масштабов их опасности. Катастрофу такого масштаба будет лучшем решением: не писать о ней в газетах, и не упоминать о ней в Государственном архиве Рязанской области."
