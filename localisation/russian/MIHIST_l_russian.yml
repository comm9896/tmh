 barba.t:0 "План «Барбаросса» – план военной операции по захвату европейской части СССР. Внезапный удар. Идея плана «Барбаросса» состояла в том, чтобы за несколько месяцев, используя тактику блицкрига, нанести сокрушительное поражение Красной Армии и захватить СССР."
