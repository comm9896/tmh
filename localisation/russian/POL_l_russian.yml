 ### Фокусы ЮАСА
POL_Gray_imports:0 "Серый импорт металлов"
POL_Gray_imports_desc:0 "Для выживания остатков нашей экономики нам крайне необходимо наладить стабильный поток жизнено важных ресурсов, и не важно как и откуда они будут получены..."
 
POL_Gray_imports_oil:0 "Импорт энергоресурсов"
POL_Gray_imports_oil_desc:0 "Для нормального функционирования нашей “Гаражной” промышленности в изгнании нам необходимы энергоресурсы, Нефть… Газ… Уголь… Нам нужно все что сможет раскрутить маховик работы наших станков и наполнит баки нашей техники."

POL_foreign_naval_support_2:0 "Закупить судостроительное оборудование"
POL_foreign_naval_support_2_desc:0 "Долгое время заброшеная верфь британии, что до этого производила краболовов нуждается в серьезной модернизации. Наши специалисты готовы вдохнуть новую жизнь в это предприятие и наладить производство современных караблей."

POL_exile_industries_2:0 "Промышленный лидер в изгнании"
POL_exile_industries_2_desc:0 "Долгая время наша страна была лидером в области развития промышленности, однако сейчас нам предстоит вновь показать всему миру, что наш маленький гараж кооператив, все что осталось от некогда великой польской промышленности, еще может показывать чудеса промышленной оптимизации."

