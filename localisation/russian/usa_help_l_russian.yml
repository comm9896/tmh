JAP_operation_Z:0 "Операция "Z" "
 JAP_operation_Z_desc:0 "Пришло время привести наш план в действие. Мы нанесем удар в южном направлении и установим контроль над богатыми западными колониями. Благодаря быстрой и стремительной атаке мы лишим врага возможности сражаться еще до начала настоящего сражения. Тэннохэйка бандзай!"

JAP_operation_e_d_m:0 "Операции "E D M" "
 JAP_operation_e_d_m_desc:0 "Наше верховное командование сочло невозможным высадиться и оккупировать [AST.GetNameRuAcc] и [NZL.GetNameRuAcc] и предложило лучшее решение в отношении этих враждебных стран. Мы должны занять менее защищенные острова вокруг них и отрезать их от союзников, чтобы тем самым постепенно лишить их желания воевать с нами."

JAP_operation_mo:0 "Операция МО"
 JAP_operation_mo_desc:0 "[AST.GetNameDef] в изоляции, теперь пришло время битвы за небеса над континентом. Если мы сумеем взять их под контроль, то, возможно, оккупация Океании перестанет казаться безумием."


