ROM_escort_aircraft_carriers:0 "Эскортные авианосцы"
ROM_escort_aircraft_carriers_desc:0 "Нашей морской пехоте часто приходится сражаться вдалеке от наших аэродромов. Для успешных десантных операций нашим морским пехотинцам жизненно необходимы эскортные авианосцы вооруженные штурмовой авиацией готовой поддержать наших парней в любой части света."

ROM_Financing_ROMLOC:0 "Финансирование ROMLOC"
ROM_Financing_ROMLOC_desc:0 "Компания ROMLOC является основой нашей военной экономики. Все наше производство грузовиков и поездов с боеприпасами всецело зависит от нее. Нам нужно поддержать их деятельность чтобы обеспечить дальнейший рост производства военной техники в Румынии."


ROM_avionics_development_iar:0 "Развитие собственной Авионики"
ROM_avionics_development_iar_desc:0 "Наша страна прошла долгий путь становления собственных независимых ВВС. Сейчас мы уже освоили собственное производство самолетных двигателей и фюзеляжей, однако без современной авионики мы не сможем конкурировать в воздухе с ведущими державами."


