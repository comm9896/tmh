 ### Фокусы ЮАСА
 
 Extensive_funding_for_South_African_industry:0 "Расширение инвестиций в Южную Африку"
 Extensive_funding_for_South_African_industry_desc:0 "Иностранные компании уже давно положили глаз на наши огромные залежи природных богатств. Возможно нам стоит передать часть из них им в собственность в обмен на инвестиции в нашу промышленность."

 Maximum_optimization_of_industrial_production:0 "Максимальная оптимизация производства"
 Maximum_optimization_of_industrial_production_desc:0 "В столь трудный час, нам нужно направить все силы на оптимизацию нашей военной промышленности. Нужно что бы каждый человек, стоящий у станка, понимал, что именно в его руках сейчас куется бедующая победа нашей великой страны!"

 SAF_Modern_aircraft_carrier:0 "Строительство эскортного авианосца"
 SAF_Modern_aircraft_carrier_desc:0 "Для своевременной и надежной защиты наших транспортных путей от атак вражеских волчьих стай, нашей стране необходим авианосец, что в паре с эскадрой миноносцев будет осуществлять охоту за вражескими подводными лодками."

 SAF_submarine_modular_design:0 "Модульная конструкция"
 SAF_submarine_modular_design_desc:0 "Для более эффективного нарушения морских коммуникаций противника нам необходимо нарастить выпуск современных подводных лодок. Если мы разделим конструкцию лодки на несколько не зависимых модулей, что можно будет быстро соединить вместе воедино, то это может позволить нам увеличить объем их выпуска."

 SAF_Pride_of_the_Navy:0 "Гордость ВМФ"
 SAF_Pride_of_the_Navy_desc:0 "Долгое время мы полагались на Флот Британии, наши адмиралы и вся наша нация с давних пор мечтали об обретении своего собственного, нового и полностью современного линейного корабля. Пришла пора заявить на весь миро том, что скоро Южная Африка станет новой владычицей морей!"

 SAF_South_African_of_MI_6:0"Южноафриканский Филиал МИ-6"
 SAF_South_African_of_MI_6_desc:0"Для лучшего взаимодействия с нашим Британским центром разведки МИ-6 нам стоит открыть местный филиал данной организации для лучшего контроля и координации разведывательной деятельности нашей страны и Британской короны в Южной Африке."



