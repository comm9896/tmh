SAF_modular_design:0 "Модульная конструкция"


SAF_Naspers:0 "Насперс"
SAF_Naspers_desc:0 "Крупнейшая средство массовой информации в Южной Африке. В правильных руках способны направить внутреннею энергию нашей нации в нужное русло."

SAF_The_Gold_Fields_of_South_Africa:0 "Золотые прииски Южной Африки"
SAF_The_Gold_Fields_of_South_Africa_desc:0 "Только сделав ставку на экспорт полезных ископаемых мы сможем в будующем стать сырьевой сверхдержавой"



