 ### Фокусы Канады
 CAN_scientific_institute:0"Поддержка научных иститутов"
 CAN_scientific_institute_desc:0"Теперь, когда наша страна наконец смогла полностью оправится от Эха Великой депрессии, у нас появились дополнительные средства, которые в столь трудный час мы должны направить на развитие отечественной науки. Мы не может позволить себе отстать в технологическом плане от наших противников."

 CAN_protect_CUB:0"Защита Кубинского Хрома"
 CAN_protect_CUB_desc:0"Наш большой сосед не особо спешит с принятием мер по защите Кубинских ресурсов от влияния стран ОСИ. Если мы сами не возьмем на себя инициативу и не возьмем Кубу под нашу охрану, то потом может уже быть слишком поздно."

 CAN_Modernization_of_dry_docks:0"Модернизация сухого дока в Монреале"
 CAN_Modernization_of_dry_docks_desc:0"Наши текущие судостроительные возможности не позволяют нарастить выпуск кораблей для нужд наших ВМФ. Модернизация сухого дока для постройки крупнотоннажных кораблей позволит нашей судостроительной отрасли нарастить выпуск современных кораблей."

 CAN_submarine_war:0"Тоннажная война"
 CAN_submarine_war_desc:0"Хоть наша страна и уязвима для вражеских атак по нашим морским коммуникациям, однако кто сказал, что мы не должны отвечать противнику тем же? Современные подводные лодки помогут нам защитить наши морские пути от вражеских морских вторжений на наши острова."

 CAN_branch_of_MI_6:0"Североамериканский Филиал МИ-6"
 CAN_branch_of_MI_6_desc:0"Для лучшего взаимодействия с нашим Британским центром разведки МИ-6 нам стоит открыть местный филиал данной организации для лучшего контроля и координации разведывательной деятельности нашей страны и Британской короны в Южной Африке."


