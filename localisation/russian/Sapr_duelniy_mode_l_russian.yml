Sapr_pravila.1.b:0 "Правила игры для дуэльного режима"
Sapr_pravila.1.c:0 "1. Во время дуэли запрещено создавать новые дивизии \n\n 2. Перед началом дуэли можно выбрать любую сухопутную доктрину, назначить любого советника и любого генерала. Запрещено перекликивать воздушную доктрину, назначать советников на авиацию и назначать духи авиации. \n\n 3. Количество истребителей на авиа рег – 4000  \n\n 4. Количество штурмовиков на авиа рег – 1000  \n\n 4. Авиация расклинивается со старта на все авиа регги. Запрещено перекрикивать авиацию во время дуэли.\n\n 5. Перед началом Дуэли необходимо выбрать билд сухопутной армии в решениях"
Sapr_pravila.1.d:0 "ок!"


