Sapr_firs_sowrld_war_trait:0 "Сторонник статичной войны"
Sapr_firs_sowrld_war_trait_desc:0 "Офицерские курсы во Франции сильно повлияли на его тактику ведения боевых действий в современной войне. Быстрое возведение неприступной линии обороны и изматывание противника – вот прямой путь к победе!"

Sapr_meat_storm_supporter_trait:0 "Сторонник массированного штурма"
Sapr_meat_storm_supporter_trait_desc:0 "Офицерские курсы в СССР, помноженные на опыт войны в Китае отложили сильный отпечаток на тактику применения пехотных подразделений на поле боя. Людской ресурс стоит дешевле чем новый танк, так зачем гнаться за массовым производством танков, если обычный солдат, вооруженный штыком и гранатой, способен достичь в наступлении таких же результатов, как и целая танковая дивизия?"

Sapr_Advocate_of_a_quick_war_trait:0 "Сторонник молниеносной войны"
Sapr_Advocate_of_a_quick_war_trait_desc:0 "Прохождение офицерских курсов в Германии отложили сильный отпечаток на тактику ведения боевых действий в современной войне. Быстрые и молниеносные прорывы на узком участке фронта с последующим уничтожением тылов противника – вот прямой путь к победе!"


