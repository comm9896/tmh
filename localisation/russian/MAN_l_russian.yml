MAN_Chan_Kunsan:0 "Чань Кунсан"





SOV_Aleksandr_Cherepanov:0 "Александр Черепанов"
### Эвенты на генералов

MAN_victory_in_northern_china.1.b:0 "Освобождение северных регионов Китая"
MAN_victory_in_northern_china.1.c:0 "В ходе затяжных боев наша армия, при поддержки наших Японских братьев по оружию смогла оттеснить армию самопровозглашенного правительства народного Китая и освободила старинную столицу нашей родины – Пекин. Это долгожданное событие для всей нашей великой Китайской нации. Вся нация с воодушевлением следит за нашими успехами на поле боля и с нетерпением ждет следующих грандиозных побед. Из-за опоры на духовную связь с императором Айсиньгеро Пуи наша армия способна на самые не мыслимые свершения на поле боя. \n\n За императора! За Пуи!"
MAN_victory_in_northern_china.1.d:0 "Долгожданное возвращение наших исконных территорий"

MAN_victory_in_center_china.1.b:0 "Освобождение центральной части Китая"
MAN_victory_in_center_china.1.c:0 "Благодаря всесторонней помощи наших Японских братьев мы смогли освободить большую часть исконно наших земель из лап Гоминьдана. Наши войны воодушевлены и верят в скорую неминуемую победу нашей нации и прекращении этой многолетней гражданской войны. Скоро все жители объединенного Китая присягнут в верности ее единственному и не сменному лидеру, императору Айсиньгеро Пуи. \n\n Наши войны уже успели набраться опыта ведения активных боевых действий в трудных условиях и в скором времени они смогут положить конец этой затянувшейся гражданской войне. \n\n За императора! За Пуи!"
MAN_victory_in_center_china.1.d:0 "Скоро мы свергним правительство Гаминьдана"

MAN_victory_in_Singapore.1.b:0 "Освобождение Сингапура"
MAN_victory_in_Singapore.1.c:0 "Буквально несколько дней назад, наши отважные Маньчжурские войска при непосредственной поддержке наших Японских братьев, смогли освободить народ Сингапура от гнета западноевропейских империалистов. \n\n Противник отчаянно пытался не допустить потери этого стратегически важного полуострова, однако сама природа благоволила нам. Опираясь на массированную поддержку с воздуха и сокрушительную огневую мощь Японского императорского флота, оборона противника была прорвана и дезорганизована. \n\n Успех в операции во многом был обеспечен умелым использованием танковых подразделений Гу Чжутуном в координации с мотопехотой Ёсико Кавасимы. Танковые подразделения обеспечивали прорыв обороны противника, а мотопехота быстро занимала оборону и укрепляла фланги. Наш император Айсиньгёро Пуи лично наградил их высшими боевыми наградами."
MAN_victory_in_Singapore.1.d:0 "Прекрасная работа армии Китайской Империи"

MAN_victory_in_Burma.1.b:0 "Освобождение Бирмы"
MAN_victory_in_Burma.1.c:0 "Британские Империалисты долгое время выкачивали ресурсы из своей главной колонии – Индии. Долгое время народ Индии, не покладая рук, работал на обогащение Британских толстосумов. Однако скоро мы положим конец этому бесчеловечному режиму и подарим народу этой страны долгожданную свободу. \n\n Разработанный нашим генеральным штабом план освобождения Индии включал ряд концентрированных ударов по сходящимся направлениям с целью скорого окружение и уничтожение сил противника в районе Рангуна и Мандалайа и одновременно не допущения их отступления в глубь территории ко второй линии обороны вдоль горного хребта. \n\n Костяк обороны Бирмы составляли объединенные танковые и полицейские подразделения Британской короны. Они выступали не только мобильным резервом главного командования, но еще и гарантом дисциплины на поле боя. В случаи если в войсках Индийской армии появлялись зачатки антивоенных или анти Британских настроений, полиция Британской короны при поддержке танков быстро наводила порядок на местах, попутно проводя ряд демонстративных казней и пыток рядовых солдат марионеточной Индийской армии. \n\n Залогом успеха операции послужила грамотное и хорошо скоординированное взаимодействия различных родов войск, в основе которых стояли танки под командованием Гу Чжутуном и мотопехота Ёсико Кавасимы. В армии уже во всю ходят слухи что они отлично координируют свои действия не только на линии фронта, но еще и в глубоком тылу."
MAN_victory_in_Burma.1.d:0 "Скоро мы освободим Индийский народ из лап Британских эксплуататоров"

MAN_victory_in_India.1.b:0 "Освобождение Индии"
MAN_victory_in_India.1.c:0 "Освободив Бирму от гнета Британской короны наши войска ужаснулись той жестокости, которую они обрушили на народ этой страны. Из-за неурожая в регионе, и при этом активной оккупационной политике, направленной на вывоз ресурсов в метрополию, местное население было поставлено на грань выживания. Противник всячески пытался защитить свою колониальную жемчужину, однако наша армия оказалась значительно сильнее. \n\n Успех наступления снова во многом был обеспечен грамотной и гармоничной работой нашего прославленного дуэта в лице Гу Чжутуном и Ёсико Кавасимы. Слухи об их отношениях уже давно ходили в войсках, однако сейчас стало официально известно о их романе. Наш народ положительно отреагировал на эту новость и пожелал успеха в создании новой ячейки Китайского общества!"
MAN_victory_in_India.1.d:0 "Наконец-то народ Индии обрел свободу"

MAN_Liberation_of_the_Dutch_East_Indies.1.b:0 "Освобождение Ост-Индии"
MAN_Liberation_of_the_Dutch_East_Indies.1.c:0 "Британская и Голландские империалисты уже долгое время выкачивали все соки из жителей Суринама, Борнео, Калимантана и Явы. Однако наконец-то настал день, когда местные жители этих островов могут сбросить с себя цепи рабства и вздохнуть полной грудью. \n\n План вторжения на острова включал в себя ряд морских десантных высадок с целью захвата портовой инфраструктуры. Противник хорошо подготовился к обороне своих колоний. Для защиты своего источника благосостояния, Голландцы мобилизовали в свою регулярную колониальную армию даже детей. Однако отважные войны Китайской империи принесли свободу и со процветания в эти земли. Более народ этих земель не будет работать на благо Западноевропейских толстосумов и во всю займется развитом своей собственной нации."
MAN_Liberation_of_the_Dutch_East_Indies.1.d:0 "Еще один народ Океании теперь свободен"

MAN_Liberation_of_the_Philippines.1.b:0 "Освобождение Филиппин"
MAN_Liberation_of_the_Philippines.1.c:0 "Долгое время народ Филиппин находился под гнетом Американских империалистов. При поддержки наших Японских товарищей мы смогли выбить Американскую армию с занимаемых и насиженных курортных военно-морских баз. \n\n При поддержки военно-морского флота и палубной авиации мы смогли быстро занять выгодные рубежи обороны и подготовится к дальнейшим действиям по освобождению народа этих островов. Местное населения встречало нашу армию как освободителей и всячески пыталось помочь нам в освобождении их дорогой родины. Армия США пыталась сдержать наше наступление, однако их армия не что на фоне отважных бойцов Китайской Империи."
MAN_Liberation_of_the_Philippines.1.d:0 "Еще один народ Океании теперь свободен"



