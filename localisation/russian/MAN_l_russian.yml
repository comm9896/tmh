l_russian:
 ### Фокусы Франции
 MAN_United_Army_of_China:0 "Единая армия Китая"
 MAN_United_Army_of_China_desc:0 "Армия Гоминьдана разбита и более не существует. Офицеры и генералы, что ранее были нашими врагами, как истинные патриоты своей родины готовы оказать нам помощь в защите нашей родины. Их боевой опыт поможет нам в становлении единой армии Китайской империи!"
 
 
 MAN_development_of_southern_territories:0 "Развитие южных территорий"
 MAN_development_of_southern_territories_desc:0 "Недавно освобожденные наши территории из лап не легитимного правительства Гоминьдана достались нам в весьма плачевном состоянии. Однако трудолюбивый народ Пекина и Цзинаня готов верой и правдой трудится на благо последнего легитимного императора великой империи Цин!"
 
 MAN_development_of_western_territories:0 "Развитие Западных территорий"
 MAN_development_of_western_territories_desc:0 "Развитие наших западных территории сильно затруднено полным отсутствием там хоть какой-то инфраструктуры. Если мы в серьез хотим рассчитывать на равномерное развитие нашей страны, то нам стоит начать со строительства дорог, мостов и тоннелей с востока на запад."
 
 MAN_railway_compani:0 "Маньджурская железная дорога"
 MAN_railway_compani_desc:0 "Маньчжурская железнодорожная компания обладает значительным политическим и экономическим влиянием в нашей стране. Нам стоит направить их финансовую и экономическую силу в нужное русло. Так мы сможем обеспечить наше совместное процветание в регионе."
 
 MAN_China_railway:0 "Восточно-Китайская железная дорога"
 MAN_China_railway_desc:0 "Гармоничное развитие наших обширных земель невозможно без своевременной доставки ресурсов. Нам необходимо объединить все наши промышленные центры на Севере и Юге в единую транспортную сеть. Маньчжурские железные дороги готовы помочь нам в опутывании нашей необъятной страны современной железнодорожной сетью."
  
 MAN_China_railway_2:0 "Западно-Китайская железная дорога"
 MAN_China_railway_2_desc:0 "Опыт интеграции наших восточных промышленных центров показал прекрасные результаты. В ранее сторнирующие регионы хлынул поток инвестиций от наших Маньчжурских и Японских компаний. Нам не стоит останавливаться на достигнутом результате и продолжить встраивать наши дальние города на западе страны в единую транспортную сеть."
   
 MAN_China_infr:0  "Развитие инфраструктуры"
 MAN_China_infr_desc:0 "Для привлечения иностранных инвестиций в регион нам необходимо сосредоточится на развитии инфраструктурных объектов в Маньчжурии. Это послужит надежной базой для гармоничного и долгосрочного развития нашей великой страны."

 MAN_collaboration_with_the_japanese_plane:0  "Приглашение Японских авиастроителей"
 MAN_collaboration_with_the_japanese_plane_desc:0  "Уровень развития авиации в нашей стране находится на зачаточном уровне. Пока все ведущие державы во всю покоряют небеса, мы топчемся на месте. Нам стоит обратиться к Японии за помощью в развитии нашей летной школы."
 
 MAN_purchase_of_aviation_licenses:0  "Лицензии на авиационное оборудование"
 MAN_purchase_of_aviation_licenses_desc:0  "Очевидно, что своими силами мы не в силах догнать наших оппонентов в области развития авиации. Если мы действительно хотим видеть развитие нашего авиастроения, то нам нужно закупить лицензии на все современные технологии в области авиастроения у нашего ближайшего союзника и партнера, в лице Японии."
 
 MAN_Manchu_attack_aircraft:0 "Развитие штурмовой авиации"
 MAN_Manchu_attack_aircraft_desc:0 "Недавний опыт боевых действий показал нам то, на сколько значимое влияние на ход ведения сухопутных боев может оказывать штурмовая авиация. Нам стоит заняться скорейшей разработкой собственного проекта штурмовика. Мы возьмем часть Японских нароботок и используем их для разработки нашего собственного штурмовика." 

 MAN_invite_foreign_investors:0 "Приглашение инвесторов"
 MAN_invite_foreign_investors_desc:0 "Пусть это и унизительно, но нам придется обратиться к нашим эксплуататорам за помощью в деле индустриализации страны."

 MAN_closer_ties_with_germany:0 "Сближение с Германией"
 MAN_closer_ties_with_germany_desc:0 "Дипломатические контакты с Германией расширили наши возможности в области сотрудничества – в их числе кредиты для дальнейшего индустриального развития."

 MAN_give_falkenhausen_citizenship:0 "Гражданство для Фалькенхаузена"
 MAN_give_falkenhausen_citizenship_desc:0 "Немецкие советники внесли неоценимый вклад в восстановление и модернизацию нашей армии. Нужно приложить все усилия, чтобы они остались здесь, как бы дальше ни сложилась политическая ситуация."

 MAN_wargaming_division:0 "Отдел военных игр"
 MAN_wargaming_division_desc:0 "Нужно сформировать отдел генштаба, задачей которого будет предсказывать будущие войны и работать над тактикой и стратегией. Вероятнее всего, для имитации мировой войны им потребуется какое-нибудь вычислительное устройство..."
 
 MAN_chinese_panzers:0 "Китайские танки"
 MAN_chinese_panzers_desc:0 "Немецкие танки, вне всяких сомнений, не имеют себе равных в мире. Нужно последовать примеру Германии и разрабатывать собственные танки на основе тех же принципов."
 
 MAN_tank_plant:0 "Танковый завод"
 MAN_tank_plant_desc:0 "Наша разработка танков идет полным ходом. Пора задуматься о заводе, который будет их строить."

 MAN_rapprochement_with_soviet_union:0 "Сближение с Советским Союзом"
 MAN_rapprochement_with_soviet_union_desc:0 "Пусть у нас есть некоторые идеологические разногласия с СССР, за последнее время стало очевидно, что и общих интересов тоже достаточно. Нам следует формально закрепить наши отношения и заключить договор о ненападении, чтобы продемонстрировать всему миру наше единство."

 MAN_elite_mountaineers:0 "Элитные горные стрелки"
 MAN_elite_mountaineers_desc:0 "Бои на высокогорье всегда значительно отличаются от сражений на равнинах. Нужно подготовить специализированные подразделения, способные пользоваться преимуществами рельефа местности."

 MAN_hire_soviet_designer:0 "Помощь советских конструкторов"
 MAN_hire_soviet_designer_desc:0 "Советы уже достаточно давно занимаются разработкой бронетехники. Помощь лучших советских конструкторов была бы бесценна для наших собственных проектов."

 MAN_joint_tank_development:0 "Совместная разработка танков"
 MAN_joint_tank_development_desc:0 "Опыт, полученный от сотрудничества с советскими конструкторами, привел нас к пониманию того, что эффективнее всего будет создать совместные конструкторские бюро, которые позволят нам лучше координировать работу и обмениваться знаниями."

 MAN_combined_arms_warfare:0 "Общевойсковые операции"
 MAN_combined_arms_warfare_desc:0 "Колесные грузовики позволяют нам проводить эксперименты в области применения механизированных подразделений, но для активных боевых действий им не хватает проходимости и защиты."

 MAN_heavy_weapons:0 "Тяжелое вооружение"
 MAN_heavy_weapons_desc:0 "Без поддержки артиллерии армия не сможет отразить нападение врагов. Нужно обеспечить вооруженные силы адекватным снаряжением."

 MAN_mission_to_germany:0 "Делегация в Германию"
 MAN_mission_to_germany_desc:0 "Европейские парии проводят активные реформы, стремясь вернуть былую славу. Мы можем многому у них научиться."

 MAN_mission_to_germany:0 "Современные подводные лодки"
 MAN_mission_to_germany_desc:0 "Европейские парии проводят активные реформы, стремясь вернуть былую славу. Мы можем многому у них научиться."

 MAN_modern_submarines:0 "Современные подводные лодки"
 MAN_modern_submarines_desc:0 "Кригсмарине готовы предоставлять нам технологии, которые позволят нам достаточно эффективно вести активные боевые действия на море в акватории Тихого и Индийского океана."

 MAN_modern_battleships:0 "Современный Линейный Корабль"
 MAN_modern_battleships_desc:0 "Хоть мы и безнадежно отстали от развитых стран в области разработки и строительства современных линейных кораблей, однако Немецкие промышленники согласились поделится с нами проектом своего современного линейного корабля. Может он и не достаточно хорошо защищен, однако, зато быстрый и в случаи чего всегда сможет успеть уйти от преследования противника."

 MAN_invite_soviet_advisers:0 "Приглашение советников из СССР"
 MAN_invite_soviet_advisers_desc:0 "Советский Союз предложил нам помощь в восстановлении наших вооруженных сил."

 MAN_support_German_specialists:0 "Помощь Немецких судостроителей"
 MAN_support_German_specialists_desc:0 "Для развития собственных военно-морских технологий нам нужно перенимать опыт зарубежных компаний. Открыв у себя в столице филиал компании “Блом энд Фосс” мы сможем развивать собственные военно-морские технологии с опорой на опыт наших Немецких коллег."

 MAN_Construction_of_skerries:0 "Строительство шхер"
 MAN_Construction_of_skerries_desc:0 "Для наращивания выпуска отечественных подводных лодок мы построим современные, бомба защищённые, стапеля для выпуска И обслуживания нашах подводных лодок."

 MAN_collaboration_with_the_japanese:0 "Сотрудничество с Японией"
 MAN_collaboration_with_the_japanese_desc:0 "Что бы японцы ни планировали в отношении Китая, они демонстрируют нам свою готовность к сотрудничеству, если мы проявим должное уважение."
 
 MAN_order_destroyers:0 "Заказ эсминцев"
 MAN_order_destroyers_desc:0 "В качестве первого шага к модернизации флота следует произвести небольшую партию эсминцев."

 MAN_naval_aviation:0 "Авианосцы"
 MAN_naval_aviation_desc:0 "Будущее боев на море – за авианосцами. Нам никогда не стать по-настоящему морской державой, пока у нас не будет собственного авианесущего флота."

 MAN_Help_from_Japanese_specialists:0 "Помощь Японских судостроителей"
 MAN_Help_from_Japanese_specialists_desc:0 "Японские специалисты давно пристально присматривают за нашим рынком. Предложив выгодные условия мы сможем открыть у себя на родине филиал Японского судостроительной компании что поможет нам в развитии отечественного судостроения."

 MAN_investment_into_shipbuilding:0 "Современные стапеля"
 MAN_investment_into_shipbuilding_desc:0 "Если мы хотим участвовать в современной военно-морской гонке, то нам необходимо начать со строительство новых стапелей для строительства крупнотоннажных кораблей."
 
 MAN_train_marine:0 "Подготовка морской пехоты"
 MAN_train_marine_desc:0 "Наша длинная береговая линия уязвима для вражеских высадок с моря. При этом, однако, она дает нам возможность атаковать с неожиданных направлений, если противник вдруг окажется на нашей территории."

 MAN_Modernization_navy:0 "Модернизация Флота"
 MAN_Modernization_navy_desc:0 "НСейчас у нас есть современный военно-морской флот, однако без знания современной доктрины мы вряд ли сможем добиться хоть сколько ни будь значимых успехов в войне на море."

 MAN_new_rifles:0 "Разработка новых видов винтовок"
 MAN_new_rifles_desc:0 "Требуется заменить устаревшие виды вооружений для защиты наших границ"

 MAN_jungle_training:0 "Война в джунглях"
 MAN_jungle_training_desc:0 "Необходимо подготовить наши войска к ведению боевых действий в условиях джунглей"

 Man_cheap_weapons:0 "Удешевлённое производство пехотного вооружения"
 Man_cheap_weapons_desc:0 "Нужно наполнить войска дешёвым и надёжным вооружением для продвижения наших интересов на глобальной политической карте"
### Идеи
MAN_mio_trait_Muckden_tt:0 "Мукденский арсенал"

Great_Emperor_of_China_Aisingyoro_Puyi:0 "Великий император Китая Айсиньгёро Пуи"
MAN_The_Closed_Trade_Policy_of_the_East_Asian_Co_Prosperity_Sphere:0 "Маньжурская автаркия"
MAN_CAS_manufacturer:0 "Тачикава"

MAN_replace_mukden_arsenal_designer_tt:0 "Улучшит все концерны §YМатериального обеспечения§! Маньчжурии"

MAN_south_manchuria_railway_tt:0 "Выполнение фокуса §Y Маньджурская §! улучшит данный концерн!"
MAN_showa_steel_works_tt:0 "Выполнение фокуса §Y Привлечение Японских инвесторов §! улучшит данный концерн!"
MAN_western_refinery_tt:0 "Выполнение фокуса §Y Привлечение Японских инвесторов §! улучшит данный концерн!"
shanghai_electronics_tt:0 "Выполнение фокуса §Y Привлечение Японских инвесторов §! улучшит данный концерн!"

MAN_Chou_Junfat:0 "Чоу Юньфат"
