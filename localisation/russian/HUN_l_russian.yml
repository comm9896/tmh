HUN_admiral_miklos_horthy:0 "Адмирал Венгерского флота"
HUN_admiral_miklos_horthy_desc:0 "У нашей страны есть малый флот способный вести активные боевые действия в акватории Черного моря и судоходных рек. Нашей стране нужен талантливый адмирал, что ранее уже успел проявить себя в морских сражениях, нашему флоту нужен Миклош Хорти."
HUN_admiral_miklos_horthy_tt:0 "§YМиклош Хорти§! станет §Y Адмиралом §! и возглавит великую Балатонскую флотилию."

HUN_fortify_the_borders:0 "Укрепление границ" 
HUN_fortify_the_borders_desc:0"Наведя порядок во внутренних делах, нам следует обратить внимание на защиту границ от внешней угрозы."

HUN_Eastern_rampart:0 "Укрепить Южный Буг"
HUN_Eastern_rampart_desc:0 "Если мы хотим сохранить мир на наших исторических землях, то нам нужно заблаговременно приступить к формированию резервной линии обороны, что своим щитом защитит Румынский народ от коммунистической заразы. Построив укрепления вдоль Южного Буга мы обеспечим себе надежный рубеж обороны."

HUN_Eastern_denstr:0 "Укрепить Днестр"
HUN_Eastern_denstr_desc:0 "Хоть мы и смогли обратно вернуть под свой контроль Бессарабию, однако наши граждане не уверены, в том, что угроза с востока вновь не постучится в двери нашей великой страны. Постройка укреплений на Днестре позволит обеспечить надежную защиту нашей родине от дикарей с востока."

HUN_Eastern_prut_i_dunai:0 "Укрепить Прут и Дунай"
HUN_Eastern_prut_i_dunai_desc:0 "Агрессивная политика советского союза беспокоит народ нашей страны. Они уже посмели силой забрать у нас Бессарабию. Если мы действительно хотим защитить себя, то нам нужно как следует подготовится к обороне и возвести линию непреступных укреплений по реке Прут с переходом на Днестр. "

HUN_Great_Romania:0 "Великая Венгерская Румыния!"
HUN_Great_Romania_desc:0 "С самого своего появления, Советский союз оккупировал правобережные территории Днестра. Коммунистическая зараза отравила жизнь наших Румынских граждан Приднестровья. Нашей исторической миссий, будет триумфальное освобождение Румынских граждан из лап Коммунистических поработителей."

HUN_Development_of_new_territories:0 "Развитие новых территорий"
HUN_Development_of_new_territories_desc:0 "Советский союз не чего кроме голода и разорения не принес народу Украины. Мы должны поддержать наших новообретенных граждан и показать им что мы пришли к ним как освободители и носители Европейской цивилизации."
 
 

HUN_Association_of_plants_Electra:0 "Объединение заводов "Электра" "
HUN_Association_of_plants_Electra_desc:0 "Чешский концерн “Электра” с давних времен занимается передовыми исследованиями в области электроники. После распада Чехословакии их научные и производственные мощности оказались не кому не нужными. Нам нужно объединить все их разрозненные институты и мастерские в один единый научно-производственный комплекс в Словакии."
HUN_Association_of_plants_Electra_tt:0 "Улучшит промышленный концерн §Y Электра§!"

