HUN_Great_fleet:0 "Мечта Хорти"
HUN_Great_fleet_desc:0 "Наш великий правитель, Адмирал Миклош Хорти, уже давно ведет успешное управление нашим королевством. Однако мы видим, как он тоскует по морским походам. Нам нужно приободрить его и сделать подарок в виде нескольких кораблей, очень ХОРОШИХ кораблей. Может на этот проект и уйдет половина бюджета Венгрии, однако мы смело сможем заявить на весь мир, что хоть у нас и нет выхода к морю, зато у нас есть СВОЙ карманный линейный флот!"
