Ger_Fuehrer_directive_land_corridor_to_Courland:0 "Директива Фюрера по пробитию сухопутного коридора в Курляндию"
Ger_Fuehrer_directive_land_corridor_to_Courland_tt:0 "В случаи успешного пробития сухопутного коридора до §YКурляндии§!, §YЖемайтия§! станет считаться национальной территорией §YГермании§! и получит бонус к защите против §YСоветов§!"

