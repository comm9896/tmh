l_russian:
 ### Фокусы германии
 
 GER_integrate_war_economies_tt5:0 "Если §YБолгария§! и §YТретий рейх§! союзники, то они получают по §Y4 военных завода§!, а §YБолгария§! станет марионеткой державы §YТретий рейх§!"
 GER_integrate_war_economies_tt6:0 "§t Государство Болгария должно утвердить соглашение, чтобы бонусы начали действовать. §!"
 GER_integrate_war_economies_tt7:0 "В  случае, если Румыния аннексирует Болгарию и/или Венгрию до выполнения фокуса, то все положенные по фокусу военные заводы, дающиеся от них, разделят между собой Германия и Румыния."

 GER_folksturm:0 "Фольксштурм"
 GER_folksturm_desc:0"Когда враг стоит у ворот нашего дома, каждый, кто может держать в руках оружие, должен встать на защиту своей родины. Старики и дети, под командованием опытного офицера, способны стать надежной опорой нашей неприступной линии обороны."
 GER_folksturm_tt:0 "Открывает доступ к тактике: §YПартизанские методы§!"

 GER_For_Fatherland:0 "За Фатерлянд!"
 GER_For_Fatherland_desc:0 "Кто бы мог подумать, что война вновь доберется до границ нашей родины… Мы слишком много потеряли в этой войне, однако если мы проиграем, то потеряем все! Нужно чтобы каждый немец знал и понимал, что он: последняя надежда Германии!"

 GER_war_with_france_tt:0 "§t Национальный дух будет удален после капитуляции Франции§!"
 
 GER_gorod_krepost:0 "Тактика городов-крепостей"
 GER_gorod_krepost_desc:0 "Противник пытается теснить нас по всем фронтам, и дабы нам хоть как-то замедлить их продвижение вглубь нашей территории, наш Фюрер предложил превратить все стратегически важные города в крепости. Мы назначим специальных фанатично настроенных комендантов, что смогут организовать прочную оборону в городе."
 GER_gorod_krepost_tt:0 "Будет открыт доступ к решениям по объявлению §YГородов-крепостей§!"
 
 GER_miracle_on_the_Vistula:0 "Чудо на Висле"
 GER_miracle_on_the_Vistula_desc:0 "В ходе затяжной войны на восточном фронте наша армия понесла серьезные потери. Противник теснит нас по всем направлениям. Дошло до того что они уже вовсю ведут боевые действия на нашей территории в Восточной Пруссии. Наши генералы убеждены, что мы можем сдержать продвижение дикарей с востока, если как следует укрепимся по Висле и Бугу. Фюррер лично одобрил это предложение!"
 GER_miracle_on_the_Vistula_tt:0 "Во всех подконтрольных §YПольских§! и §YНемецких§! территориях по §YВисле§! будут построены §YУкрепления 10 уровня§! и добавлен бонус к атаке и защите в §YПольше§!. \n\n И помните, это наша последняя линия обороны! Позади §YФатерлянд!§!"

 GER_E_series_tanks:0 "Танки Е-серии"
 GER_E_series_tanks_desc:0 "К сожалению, наша нация не может превзойти советскую армию по количеству танков. Нам нужно сделать ставку на качество. если наши танки будут на порядок сильнее танков противника, тогда мы сможем переломить ход войны в свою пользу."
 
 GER_total_control_over_domestic_affairs_2:0 "Коричневый кардинал Лохмода"
 GER_total_control_over_domestic_affairs_2_desc:0 "Передача всех партийных дел в руки партийного канцлера полностью оправдала себя. Фюреру более не надо беспокоиться по поводу малозначимых для него дел. Теперь все внутрипартийные дела решаются непосредственно Мартином Борманом."
 
 GER_organization_todt_military_builders:0 "Расширить штат военных строителей"
 GER_organization_todt_military_builders_desc:0 "Часто бывает так, что захваченных нами территориях, нам в руки попадается разрушенные противником при отходе или в ходе боев, различные стратегически значимые объекты военной или гражданской инфраструктуры. Организация Тодта отлично справится с решением данной задачи."

