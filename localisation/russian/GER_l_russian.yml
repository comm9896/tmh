GER_time_to_war:0 "Мечты о расширении жизненного пространства"
GER_time_to_war_desc:0 "Наша нация, обремененная Версальским мирным договором, давно мечтает решить эту несправедливость. Если внешняя политика нашего государства будет не достаточно жесткой, народ нашей страны готов самостоятельно решить этот вопрос, минуя верховное правительство"

