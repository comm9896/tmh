GER_construct_the_ostwall_Votan_tt:0 "§Y[ROOT.GetName]§! или германский участник альянса полностью контролирует все регионы вдоль §Yреки Днепр§! от пункта §Y[197.GetName]§! до пункта §Y[204.GetName]§!."
