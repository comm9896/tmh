Sapr_Fuhrers_order_to_hold_Courland.1.b:0 "Приказ Фюрера по удержанию Курляндии!"
Sapr_Fuhrers_order_to_hold_Courland.1.c:0 "Стремительное наступление Советов в Прибалтике оттеснило наши силы практически до Фатерлянда. Значительная группировка войск сейчас находится в Курляндии. Удержания Курляндии позволит нам обеспечить безопасность нашим подводникам что проходят обучение на Балтике. Местное население Литвы активно записывается в ряды егерей и готово встать с нами плечом к плечу!"
Sapr_Fuhrers_order_to_hold_Courland.1.d:0 "Мы удержим пдацдарм в Прибалтике!"

Sapr_Fuhrers_order_to_Courland_corridor.1.b:0 "Приказ Фюрера по пробитию Курляндского коридора!"
Sapr_Fuhrers_order_to_Courland_corridor.1.c:0 "Наши доблестные войска Фюрера, при поддержке Латышских и Литовских лесных братьев, смогли удержать контроль над Курляндией.  Для улучшения снабжения Курляндии Фюрер приказал провести контр наступательную операцию с целью пробития сухопутного коридора с захватом города Шауляй. Фатерлянд рассчитывает на вас!"
Sapr_Fuhrers_order_to_Courland_corridor.1.d:0 "Курляндский коридор будет обеспечен!"

Sapr_Mobilization_in_Zigfrid_line.1.b:0 "Мобилизация резервистов на Линию Зигфрида"
Sapr_Mobilization_in_Zigfrid_line.1.c:0 "Армия союзников ведет успешное наступление во Франции и Бенилюксе. Мы должны срочно мобилизовать всех кто может держать оружие и ими укрепить нашу главную линию обороны по линии Зигфрида"
Sapr_Mobilization_in_Zigfrid_line.1.d:0 "Мы не пропустим союзников на территорию Германию!"

Ger_Fuhrers_order_to_start_building_fortifications_event.1.b:0 "Фюрер приказывает начать строительство долговременных укреплений на западе"
Ger_Fuhrers_order_to_start_building_fortifications_event.1.c:0 "Война на восточном фронте затянулась, и угроза вторжения Франко-Британских войск в Европу через Ламанш только усиливается. \n\n Фюрер не хочет отвлекать свое внимание от восточного фронта и поэтому он приказывает всем строительным компаниям под общим управлением организации Тодта заняться строительством долговременных укреплений на западной границе."
Ger_Fuhrers_order_to_start_building_fortifications_event.1.d:0 "Воля Фюрера будет исполнена! Атлантический вал будет возведен в срок!"

