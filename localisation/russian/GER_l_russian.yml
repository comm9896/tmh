GER_gorod_krepost_category:0 "Тактика городов-крепостей"
GER_gorod_krepost_category_desc:0 "Наш Фюрер выдвинул идею тактики городов крепостей. \n\n Мы превратим подконтрольные нам крупные города в неприступные крепости и будем готовы сражаться за них в условиях полного окружения до последнего солдата. Удерживая узлы снабжения, мы затрудним противнику вклинение в глубь нашей обороны, ценой своих жизней смогут выиграть ценное время для реорганизации обороны наших войск."

