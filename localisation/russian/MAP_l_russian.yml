EROPPA_WAR_NAME:0 "Режим онли Европа"
EROPPA_WAR_DESC:0 "В данном режиме количество играбельных стран значительно ограничено и орентировано на игру в 5-6 человек."

EROPPA_WAR_1941_NAME:0 "Режим онли Европа 1941 год."
EROPPA_WAR_1941_DESC:0 "Данный режим орентирован на быструю и веселую игру на восточном фронте. За вас уже все построено. Все что вам нужно это просто развернуть армию и начать войну."

NO_ASIA:0 "Режим без Азии"
NO_ASIA_DESC:0 "Данный режим орентирован на игру только на Европейском и Африканском театрах боевых действий. Расчитан на игру в 10-14 человек."

Only_ASIA:0 "Режим онли Азия"
Only_ASIA_DESC:0 "Данный режим орентирован на игру только на Азиатском и Тихоокеанском театрах боевых действий. Война в Европе и Африке более не будет вас отвлекать от одного из самых итересных театров боевых действий. Расчитан на игру в 10 человек."

Classic_NAME:0 "Стандартный режим игры"
Classic_DESC:0 "Стандартный исторический режим игры где доступны все театры боевых действий. Для комфортной и интерестной игры необходимо минимум 15 человек."


Duelniy_Rezhim_NAME:0 "Дуэльный режим игры"
Duelniy_Rezhim_DESC:0 "Режим для игры 1 на 1 на заранее подготовленных участках фронта."

SIA_BLITZKRIEG_DESC:0 "Долгое время  Пхрая Пхот Пхахонйотхин вел ожесточенную борьбу за власть внутри Сиама со своими собратьями революционерами."