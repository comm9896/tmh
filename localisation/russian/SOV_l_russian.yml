### Квесты


Sapr_Sov_army_reorganaized.1.b:0 "Все для фронта, все для победы!"
Sapr_Sov_army_reorganaized.1.c:0 "Несколькими часами ранее противник предпринял ряд решительных контр атак и практически в плотную приблизился к родине нашей революции, городу великого Ильича. Узнав об этой тревожной новости парт работники города правели срочной формирование отрядов народного ополчения из числа служащих и рабочих Кировского завода. Для их усиления были спешно сформированы несколько отдельных мотострелковых дивизий войск НКВД."
Sapr_Sov_army_reorganaized.1.d:0 "Защитим нашу родную землю!"


Sapr_Sov_counterattack_tactics.1.d:0 "Приказ о срочной контратаке!"
Sapr_Sov_counterattack_tactics.1.e:0 "В ставке сильно обеспокоены положением на восточном фронте. Многочисленные танковые прорывы противника угрожают сохранению целостности нашей обороны. Для усиления обороны из ставки верховного главнокомандования выделены дополнительные силы. Используйте их что бы сокрушить Фрицев!"
Sapr_Sov_counterattack_tactics.1.f:0 "Урааа! За родину! За Сталина!"


SOV_Siege_of_Leningrad.1.b:0 "Ленинград на осадном положении"
SOV_Siege_of_Leningrad.1.c:0 "Несколькими часами ранее противник предпринял ряд решительных контр атак и практически в плотную приблизился к родине нашей революции, городу великого Ильича. Узнав об этой тревожной новости парт работники города правели срочной формирование отрядов народного ополчения из числа служащих и рабочих Кировского завода. Для их усиления были спешно сформированы несколько отдельных мотострелковых дивизий войск НКВД."
SOV_Siege_of_Leningrad.1.d:0 "Все на защиту Ленинграда!"

SOV_Siege_of_Stalingrad.1.b:0 "Сталинград на осадном положении"
SOV_Siege_of_Stalingrad.1.c:0 "Несколькими часами ранее противник предпринял ряд решительных контр атак и практически в плотную приблизился к Сталинграду. В степях Кубани это единственный крупных город. Для спасения Сталинграда полит работники провели экстренное формирование отрядов народного ополчения из числа коммунистов и комольцев города и ближайших деревень. Для их усиления были спешно сформированы несколько отдельных мотострелковых дивизий войск НКВД."
SOV_Siege_of_Stalingrad.1.d:0 "Сталинград - Мы не сдадим!"

SOV_Siege_of_Moscow.1.b:0 "Москва на осадном положении"
SOV_Siege_of_Moscow.1.c:0 "Несколькими часами ранее противник предпринял ряд решительных контр атак и практически в плотную приблизился к столице нашей родины – Москве. Известие о том, что Сталин остался в Москве дополнительно воодушевило народ на организацию новой линии обороны. Для спасения столицы полит работники провели экстренное формирование отрядов народного ополчения из числа коммунистов и комсомольцев близлежащий городов и ближайших деревень. Для их усиления были спешно сформированы несколько отдельных мотострелковых дивизий войск НКВД."
SOV_Siege_of_Moscow.1.d:0 "Москву - Мы не сдадим!"

SOV_Siege_of_Sevastopol.1.b:0 "Севастополь на осадном положении"
SOV_Siege_of_Sevastopol.1.c:0 "Недавно противник смог успешно форсировать Днепр на юге. Для спасения Севастополя полит работники провели экстренное формирование отрядов народного ополчения из числа коммунистов и комсомольцев близлежащий городов и деревень. а так же пехоты Черноморского флота. Для их усиления были выделены дивизии Черных бушлатов и несколько сформированных отдельных мотострелковых дивизий войск НКВД."
SOV_Siege_of_Sevastopol.1.d:0 "Базу Черноморского флота - Мы не сдадим!"

FIN_war_with_SOV_shameful_world.1.b:0 "Позорный мир"
FIN_war_with_SOV_shameful_world.1.c:0 "Наша специальная военная операция в Карелии потерпела крах. Мы не только не могли сломить сопротивление Финов, но еще и утратили часть наших земель. Наша армия показала свою полную дееспособность. Финское руководство предложило нам заключить позорный мир на не выгодных нам условиях. Мы не только не смогли отодвинуть границу от Ленинграда, но еще нам придется расстаться с частью наших земель в Карелии."
FIN_war_with_SOV_shameful_world.1.d:0 "Это какой-то позор..."






